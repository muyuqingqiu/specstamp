site_name: SpecStamp
site_description: A local-first, spec-driven workflow for AI coding agents
site_url: https://muyuqingqiu.github.io/specstamp/
repo_url: https://github.com/muyuqingqiu/specstamp
repo_name: muyuqingqiu/specstamp
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  logo: 资源/specstamp-mark.svg
  favicon: 资源/specstamp-mark.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Quick Start: quick-start.md
  - User Guide: user-guide.md
  - FAQ: faq.md
  - Philosophy: philosophy.md
  - Quality and Security: quality-and-security.md
  - 简体中文:
      - 首页: zh-CN/index.md
      - 快速开始: zh-CN/快速开始.md
      - 使用指南: zh-CN/使用指南.md
      - 常见问题: zh-CN/常见问题.md
      - 理念与灵感: zh-CN/理念与灵感.md
      - 质量与安全: zh-CN/质量与安全.md

plugins:
  - search:
      lang:
        - en
        - zh

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

extra_css:
  - 资源/样式.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/muyuqingqiu/specstamp
      name: SpecStamp on GitHub

copyright: © 2026 SpecStamp · Apache-2.0
