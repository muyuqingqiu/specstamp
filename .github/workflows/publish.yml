name: 发布到 PyPI

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  build:
    name: 构建并验证发布包
    runs-on: ubuntu-latest
    steps:
      - name: 检出发布版本
        uses: actions/checkout@v5

      - name: 配置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: 安装构建工具
        run: python -m pip install --upgrade build twine

      - name: 核对 tag 与包版本
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_VERSION=$(PYTHONPATH=src python -c 'from codex_sdlc import __version__; print(__version__)')
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION"
          printf '发布版本：%s\n' "$PACKAGE_VERSION"

      - name: 构建并检查发布包
        run: |
          python -m build
          python -m twine check dist/*
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS.txt

      - name: 干净环境安装和双命令冒烟
        run: |
          python -m venv /tmp/specstamp-release-smoke
          /tmp/specstamp-release-smoke/bin/pip install dist/*.whl
          /tmp/specstamp-release-smoke/bin/specstamp version
          /tmp/specstamp-release-smoke/bin/codex-sdlc version

      - name: 上传发布包
        uses: actions/upload-artifact@v4
        with:
          name: specstamp-release-${{ github.event.release.tag_name }}
          path: dist/*
          if-no-files-found: error

  attach:
    name: 附加 GitHub Release 资产
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载发布包
        uses: actions/download-artifact@v5
        with:
          name: specstamp-release-${{ github.event.release.tag_name }}
          path: dist

      - name: 上传到 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    name: 可信发布到 PyPI
    needs:
      - build
      - attach
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/specstamp
    permissions:
      id-token: write
    steps:
      - name: 下载发布包
        uses: actions/download-artifact@v5
        with:
          name: specstamp-release-${{ github.event.release.tag_name }}
          path: dist

      - name: 发布到 PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
